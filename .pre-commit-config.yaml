default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: conventional-commit-message
        name: validate conventional commit message
        entry: python scripts/check_commit_message.py
        language: python
        stages: [commit-msg]
        pass_filenames: true

      - id: pre-push-quality
        name: run type checks and tests
        entry: python scripts/run_pre_push.py
        language: python
        additional_dependencies: ["mypy==2.3.1", "pytest==9.1.1"]
        stages: [pre-push]
        pass_filenames: false
