[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-fridge-edge"
version = "0.1.0"
description = "Event-driven edge software for the Smart Fridge project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
smart-fridge = "smart_fridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["smart_fridge"]
